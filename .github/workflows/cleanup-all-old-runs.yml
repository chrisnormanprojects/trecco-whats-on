name: Cleanup All Old Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all other workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Get all workflow runs in the repository.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            // Exclude this cleanup workflow's own runs so it does not try
            // to delete the currently-running cleanup job.
            const cleanupWorkflowName = context.workflow;
            const toDelete = runs
              .filter(run => run.name !== cleanupWorkflowName)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            core.info(`Found ${runs.length} total workflow runs.`);
            core.info(`Deleting ${toDelete.length} non-cleanup workflow runs.`);

            for (const run of toDelete) {
              core.info(`Deleting run ${run.id} (${run.name}) from ${run.created_at}`);

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              } catch (error) {
                core.warning(
                  `Could not delete run ${run.id} (${run.name}): ${error.status || ''} ${error.message}`
                );
              }
            }

            core.info('Cleanup finished.');
