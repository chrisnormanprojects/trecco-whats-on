name: Match Trecco app QR background to image
on:
  push:
    paths:
      - '.github/workflows/match-trecco-qr-background.yml'
permissions:
  contents: write
jobs:
  match-qr-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Match QR overlay to image gradient
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re
          image_path = Path('trecco-qr-code.jpeg')
          page_path = Path('index.html')
          assert image_path.is_file() and page_path.is_file(), 'QR image or page missing'
          with Image.open(image_path) as source:
              image = source.convert('RGB')
              w, h = image.size
              x = max(2, w // 50)
              y = max(2, h // 50)
              top = image.getpixel((x, y))
              bottom = image.getpixel((x, h-y-1))
              assert all(0 <= c <= 255 for c in top + bottom)
          fmt = lambda rgb: '#%02X%02X%02X' % rgb
          gradient = f'linear-gradient(180deg,{fmt(top)} 0%,{fmt(bottom)} 100%)'
          page = page_path.read_text(encoding='utf-8')
          pattern = r'(\.qrOverlay\{[^}]*?background:)(?:#[0-9a-fA-F]{6}|linear-gradient\([^;]*\))(;cursor:pointer\})'
          updated, count = re.subn(pattern, lambda m: m.group(1) + gradient + m.group(2), page, count=1)
          assert count == 1, 'Expected exactly one Trecco QR overlay background rule'
          if updated != page:
              page_path.write_text(updated, encoding='utf-8')
          print('QR background top:', fmt(top), 'bottom:', fmt(bottom))
          print('Overlay background:', gradient)
          PY
      - name: Commit matched background
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Match Trecco QR overlay to image blue gradient' && git push)
