name: Apply Trecco header logo
on:
  push:
    paths:
      - '.github/workflows/apply-trecco-header-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Insert responsive logo into existing brand container
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert Path('Trecco-logo.jpeg').is_file(), 'Uploaded logo missing'
          assert s.count('</style>')>=1, 'Stylesheet not found'
          if 'class="treccoHeaderLogo"' not in s:
              pattern=r'(<(?:div|span)\b[^>]*\bclass=["\'][^"\']*\bbrandTitle\b[^"\']*["\'][^>]*>)'
              matches=list(re.finditer(pattern,s,re.I))
              assert len(matches)==1, f'Expected one brandTitle container, found {len(matches)}'
              logo='<img src="Trecco-logo.jpeg" alt="Trecco What’s On" class="treccoHeaderLogo" width="360" height="110" decoding="async">'
              s=s[:matches[0].end()]+logo+s[matches[0].end():]
          css='.brandTitle>.treccoHeaderLogo{display:block;width:clamp(125px,42vw,240px);max-width:100%;height:auto;max-height:72px;object-fit:contain;object-position:left center}.brandTitle:has(>.treccoHeaderLogo)>:not(.treccoHeaderLogo){display:none!important}.brandTitle{min-width:0;flex:1}@media(max-width:390px){.brandTitle>.treccoHeaderLogo{width:clamp(115px,39vw,175px);max-height:60px}}'
          if '.brandTitle>.treccoHeaderLogo{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          assert 'src="Trecco-logo.jpeg"' in s and '.brandTitle>.treccoHeaderLogo{' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only updated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Display uploaded Trecco logo in header' && git push)
