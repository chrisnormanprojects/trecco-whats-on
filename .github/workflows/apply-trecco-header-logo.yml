name: Optimise Trecco header logo
on:
  push:
    paths:
      - '.github/workflows/apply-trecco-header-logo.yml'
permissions:
  contents: write
jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install image optimiser
        run: python3 -m pip install Pillow
      - name: Resize logo to maximum rendered width and optimise JPEG
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          p=Path('Trecco-logo.jpeg')
          assert p.is_file(), 'Logo not found'
          original_size=p.stat().st_size
          with Image.open(p) as source:
              image=ImageOps.exif_transpose(source).convert('RGB')
              print('Original dimensions:', image.size, 'bytes:', original_size)
              if image.width>384:
                  height=round(image.height*384/image.width)
                  image=image.resize((384,height), Image.Resampling.LANCZOS)
              print('Optimised dimensions:', image.size)
              image.save(p,format='JPEG',quality=82,optimize=True,progressive=True,subsampling=0)
          print('Optimised bytes:',p.stat().st_size)
          assert p.stat().st_size<original_size, 'Optimisation did not reduce file size'
          PY
      - name: Commit optimised logo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Trecco-logo.jpeg
          git diff --cached --quiet || (git commit -m 'Resize and optimise Trecco logo for web' && git push)
