name: Apply Trecco header logo
on:
  push:
    paths:
      - '.github/workflows/apply-trecco-header-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce Trecco logo size by 20 percent in index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert Path('Trecco-logo.jpeg').is_file(), 'Logo missing'
          new_css='<style id="trecco-logo-style">.treccoHeaderLogo{display:block;width:clamp(200px,57.6vw,384px)!important;max-width:min(57.6vw,384px)!important;height:auto!important;max-height:120px!important;object-fit:contain;object-position:left center}.treccoLogoHost{display:flex!important;align-items:center!important;min-width:0!important}</style>'
          s,n=re.subn(r'<style id="trecco-logo-style">.*?</style>',new_css,s,count=1,flags=re.S)
          assert n==1, f'Expected existing Trecco logo style, found {n}'
          s=s.replace("image.width=720;image.height=220;", "image.width=576;image.height=176;", 1)
          assert 'width:clamp(200px,57.6vw,384px)' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Reduce Trecco header logo by 20 percent' && git push)
