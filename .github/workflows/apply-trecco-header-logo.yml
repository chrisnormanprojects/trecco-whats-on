name: Apply Trecco header logo
on:
  push:
    paths:
      - '.github/workflows/apply-trecco-header-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move eight pixels of Trecco Moves spacing from below to above
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert '</body>' in s
          script='''<script id="trecco-moves-spacing">(function(){function adjust(){const nodes=document.querySelectorAll('a,button,[role="link"]');for(const el of nodes){if(!/trecco\\s*moves/i.test(el.textContent||''))continue;if(el.dataset.treccoMovesSpacing==='done')continue;const style=getComputedStyle(el);const top=parseFloat(style.paddingTop)||0;const bottom=parseFloat(style.paddingBottom)||0;const shift=Math.min(8,bottom);if(!shift)continue;el.style.paddingTop=(top+shift)+'px';el.style.paddingBottom=(bottom-shift)+'px';el.dataset.treccoMovesSpacing='done';}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',adjust);else adjust();new MutationObserver(adjust).observe(document.documentElement,{childList:true,subtree:true});})();</script>'''
          if 'id="trecco-moves-spacing"' in s:
              import re
              s,n=re.subn(r'<script id="trecco-moves-spacing">.*?</script>',lambda _:script,s,count=1,flags=re.S)
              assert n==1
          else:
              s=s.replace('</body>',script+'</body>',1)
          assert s.count('id="trecco-moves-spacing"')==1
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Move Trecco Moves link padding above label' && git push)
