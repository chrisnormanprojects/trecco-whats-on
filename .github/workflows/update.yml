name: Update Trecco listings

on:
  workflow_dispatch:
  schedule:
    - cron: "4,17,29,42,54 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live Parkdean feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          TODAY=$(TZ=Europe/London date +%d-%m-%Y)
          FETCH_DAYS=365

          curl --fail --silent --show-error --location             "https://trouper.parkdean-resorts.com/cabaret/booking-feed-web.php?park_id=11&date=${TODAY}&days=${FETCH_DAYS}"             -o data/showdome.json

          curl --fail --silent --show-error --location             "https://trouper.parkdean-resorts.com/cabaret/booking-feed-web.php?park_id=111&date=${TODAY}&days=${FETCH_DAYS}"             -o data/pavilion.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in (Path("data/showdome.json"), Path("data/pavilion.json")):
              with p.open(encoding="utf-8") as f:
                  data = json.load(f)
              if not isinstance(data, dict) or data.get("status") != "OK":
                  raise SystemExit(f"Unexpected Parkdean response in {p}")
          PY

          printf '{"updated_at":"%s","start_date":"%s","days_requested":%s}\n'             "$(TZ=Europe/London date '+%d %B %Y at %H:%M')"             "$(TZ=Europe/London date '+%Y-%m-%d')"             "${FETCH_DAYS}"             > data/meta.json

      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update Trecco listings"

          # Another workflow or a manual commit may have updated main while
          # this job was fetching data. Rebase onto the newest remote main
          # before pushing so the refresh does not fail with a non-fast-forward.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Data update pushed successfully"
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Unable to push refreshed data after 3 attempts"
          exit 1
