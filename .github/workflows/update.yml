name: Update Trecco listings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/validate_listings.py'
  schedule:
    - cron: "4,17,29,42,54 * * * *"

permissions:
  contents: write

concurrency:
  group: trecco-listings-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live Parkdean feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          TODAY=$(TZ=Europe/London date +%d-%m-%Y)
          START_DATE=$(TZ=Europe/London date +%Y-%m-%d)
          FETCH_DAYS=365

          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 90 \
            "https://trouper.parkdean-resorts.com/cabaret/booking-feed-web.php?park_id=11&date=${TODAY}&days=${FETCH_DAYS}" -o "$STAGING/showdome.json"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 90 \
            "https://trouper.parkdean-resorts.com/cabaret/booking-feed-web.php?park_id=111&date=${TODAY}&days=${FETCH_DAYS}" -o "$STAGING/pavilion.json"

          python3 scripts/validate_listings.py "$STAGING" "$START_DATE" "$FETCH_DAYS"
          printf '{"updated_at":"%s","updated_at_utc":"%s","start_date":"%s","days_requested":%s}\n' \
            "$(TZ=Europe/London date '+%d %B %Y at %H:%M')" \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$START_DATE" "$FETCH_DAYS" > "$STAGING/meta.json"
          cp "$STAGING/"*.json data/
          echo "Both feeds validated successfully; checked at $(date -u '+%Y-%m-%d %H:%M UTC')." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Update Trecco listings"

          # Another workflow or a manual commit may have updated main while
          # this job was fetching data. Rebase onto the newest remote main
          # before pushing so the refresh does not fail with a non-fast-forward.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Data update pushed successfully"
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Unable to push refreshed data after 3 attempts"
          exit 1
