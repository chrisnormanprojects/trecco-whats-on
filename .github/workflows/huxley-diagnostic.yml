name: Huxley diagnostic

on:
  push:
    paths:
      - ".github/workflows/huxley-diagnostic.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test exact CYD Huxley request
        shell: bash
        run: |
          set +e
          URL="https://huxley2.azurewebsites.net/departures/NBE/5?expand=true"
          echo "Testing: $URL"
          curl -sS --connect-timeout 15 --max-time 30 -D /tmp/headers.txt -o /tmp/body.txt -w "HTTP_STATUS=%{http_code}\n" "$URL"
          CURL_EXIT=$?
          echo "CURL_EXIT=$CURL_EXIT"
          echo "--- RESPONSE HEADERS ---"
          cat /tmp/headers.txt || true
          echo "--- RESPONSE BODY (first 2000 bytes) ---"
          head -c 2000 /tmp/body.txt || true
          echo
