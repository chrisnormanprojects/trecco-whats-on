name: Apply Trecco header logo
on:
  push:
    paths:
      - '.github/workflows/apply-trecco-header-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct spacing between Links buttons without changing button padding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('id="trecco-moves-spacing"')==1, 'Expected previous spacing script exactly once'
          # Relative positioning shifts the entire button visually, transferring 8px
          # of the gap below it to the gap above it without modifying its internal padding.
          script='''<script id="trecco-moves-spacing">(function(){function adjust(){for(const el of document.querySelectorAll('a,button,[role="link"]')){if(!/^trecco\\s*moves$/i.test((el.textContent||'').trim()))continue;if(el.dataset.treccoMovesSpacing==='done')continue;el.style.position='relative';el.style.top='8px';el.dataset.treccoMovesSpacing='done';}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',adjust);else adjust();new MutationObserver(adjust).observe(document.documentElement,{childList:true,subtree:true});})();</script>'''
          s,n=re.subn(r'<script id="trecco-moves-spacing">.*?</script>',lambda _:script,s,count=1,flags=re.S)
          assert n==1 and s.count('id="trecco-moves-spacing"')==1
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Correct spacing around Trecco Moves button' && git push)
