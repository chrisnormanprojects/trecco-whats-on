name: Apply Trecco Moves Link
on:
  push:
    paths:
      - '.github/workflows/apply-trecco-moves-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Trecco Moves at top of Links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="qrChoiceCard"><h2>Links</h2>'
          new='<div class="qrChoiceCard"><h2>Links</h2><a class="qrChoiceBtn" href="https://youtu.be/qAJLUExwgAg?is=C6RZmUYQNZuGBX8v" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:18px">Trecco Moves</a>'
          if new in s:
              print('Already applied')
          elif s.count(old)!=1:
              raise SystemExit('Expected unique Links heading not found; refusing to modify')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit targeted change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Add Trecco Moves video to Links page' && git push)
