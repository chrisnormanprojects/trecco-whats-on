name: Update Trecco listings

on:
  workflow_dispatch:
  schedule:
    - cron: "4,17,29,42,54 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch live Parkdean feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          TODAY=$(TZ=Europe/London date +%d-%m-%Y)

          curl --fail --silent --show-error --location \
            "https://trouper.parkdean-resorts.com/cabaret/booking-feed-web.php?park_id=11&date=${TODAY}&days=14" \
            -o data/showdome.json

          curl --fail --silent --show-error --location \
            "https://trouper.parkdean-resorts.com/cabaret/booking-feed-web.php?park_id=111&date=${TODAY}&days=14" \
            -o data/pavilion.json

          printf '{"updated_at":"%s","start_date":"%s"}\n' \
            "$(TZ=Europe/London date '+%d %B %Y at %H:%M')" \
            "$(TZ=Europe/London date '+%Y-%m-%d')" \
            > data/meta.json

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Trecco listings"
            git push
          fi
